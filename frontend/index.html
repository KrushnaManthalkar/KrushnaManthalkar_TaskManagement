<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Login Page -->
    <div id="loginPage" class="auth-container">
        <div class="auth-card">
            <h1>TaskFlow</h1>
            <p>Manage your tasks easily</p>

            <form id="loginForm">
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <p id="loginMessage"></p>

            <p>
                Don't have an account?
                <button id="showRegister" class="link-btn">
                    Register
                </button>
            </p>
        </div>
    </div>


    <!-- Register Page -->
    <div id="registerPage" class="auth-container hidden">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p>Start managing your tasks</p>

            <form id="registerForm">
                <input
                    type="text"
                    id="registerName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                    minlength="6"
                    required
                >

                <button type="submit">Register</button>
            </form>

            <p id="registerMessage"></p>

            <p>
                Already have an account?
                <button id="showLogin" class="link-btn">
                    Login
                </button>
            </p>
        </div>
    </div>


    <!-- Dashboard -->
    <div id="dashboardPage" class="hidden">

        <nav class="navbar navbar-dark bg-dark px-4">
            <span class="navbar-brand">
                TaskFlow
            </span>

            <div>
                <span id="welcomeUser" class="text-white me-3"></span>

                <button
                    id="logoutBtn"
                    class="btn btn-outline-light btn-sm"
                >
                    Logout
                </button>
            </div>
        </nav>


        <main class="container py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2>Dashboard</h2>
                    <p class="text-muted">
                        Manage your tasks
                    </p>
                </div>

                <button
                    class="btn btn-primary"
                    id="addTaskBtn"
                >
                    + Add Task
                </button>
            </div>


            <!-- Summary Cards -->
            <div class="row g-3 mb-4">

                <div class="col-md-3">
                    <div class="summary-card">
                        <h6>Total Tasks</h6>
                        <h2 id="totalTasks">0</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="summary-card">
                        <h6>Pending</h6>
                        <h2 id="pendingTasks">0</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="summary-card">
                        <h6>Completed</h6>
                        <h2 id="completedTasks">0</h2>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="summary-card">
                        <h6>High Priority</h6>
                        <h2 id="highPriorityTasks">0</h2>
                    </div>
                </div>

            </div>

            <!-- Progress Summary -->
            <div class="progress-card mb-4">

                <div class="progress-header">
                    <div>
                        <span class="progress-label">Your Progress</span>
                        <h4 id="progressText">0% completed</h4>
                    </div>

                    <div class="progress-icon">
                        ✓
                    </div>
                </div>

                <div class="progress-track">
                    <div
                        id="progressBar"
                        class="progress-fill"
                        style="width: 0%"
                    ></div>
                </div>

                <p id="progressDetails">
                    0 of 0 tasks completed
                </p>

            </div>

            <!-- Search & Filter -->
            <div class="filter-section mb-4">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search tasks..."
                >

                <select id="statusFilter">
                    <option value="All">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>

                <select id="priorityFilter">
                    <option value="All">All Priority</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>

            </div>


            <!-- Tasks -->
            <div id="tasksContainer"></div>

        </main>
    </div>


    <!-- Task Modal -->
    <div
        class="modal fade"
        id="taskModal"
        tabindex="-1"
    >
        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalTitle">
                        Add Task
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>
                </div>

                <div class="modal-body">

                    <form id="taskForm">

                        <input type="hidden" id="taskId">

                        <div class="mb-3">
                            <label class="form-label">
                                Task Title
                            </label>

                            <input
                                type="text"
                                id="taskTitle"
                                class="form-control"
                                required
                            >
                        </div>


                        <div class="mb-3">
                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                id="taskDescription"
                                class="form-control"
                                rows="3"
                            ></textarea>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">
                                Due Date
                            </label>

                            <input
                                type="date"
                                id="taskDueDate"
                                class="form-control"
                            >
                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Priority
                                </label>

                                <select
                                    id="taskPriority"
                                    class="form-select"
                                >
                                    <option value="Low">Low</option>
                                    <option value="Medium" selected>
                                        Medium
                                    </option>
                                    <option value="High">High</option>
                                </select>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Category
                                </label>

                                <input
                                    type="text"
                                    id="taskCategory"
                                    class="form-control"
                                    placeholder="e.g. College"
                                >

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Save Task
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="script.js"></script>

</body>
</html>
